[project]
name = "sim-re"
version = "0.1.0"
description = "Analyze behavioral characteristics of simulated market price series."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "arch>=7.0",
]

[project.scripts]
sim-re-analyze = "sim_re.analyze:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
